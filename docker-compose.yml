services:
  api:
    build: .
    container_name: codebase_intelligence_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/codebase_intelligence
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME}
    volumes:
      - .:/workspace
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    container_name: codebase_intelligence_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codebase_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codebase_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: