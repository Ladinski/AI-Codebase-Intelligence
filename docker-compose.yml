services:
  api:
    build: .
    container_name: codebase_intelligence_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/codebase_intelligence
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME}
      OLLAMA_URL: ${OLLAMA_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/workspace
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    container_name: codebase_intelligence_worker
    restart: unless-stopped
    command: >
      celery -A app.core.celery_app.celery_app
      worker
      --loglevel=info
      --concurrency=1
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/codebase_intelligence
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME}
      OLLAMA_URL: ${OLLAMA_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/workspace
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: codebase_intelligence_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  db:
    image: postgres:16
    container_name: codebase_intelligence_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codebase_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codebase_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: